[package]
name = "sp-addr"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcoin = "0.31.0"
kyoto-cbf = { version = "0.11.0", features = ["filter-control", "rusqlite"], default-features = false }
futures = "0.3"
rayon = "1.10.0"
redb = "2.4.0"
reqwest = { version = "0.12.15", features = ["json", "rustls-tls", "http2", "charset"], default-features = false }
silentpayments = "0.4.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
